# Eminence Life Science — Render Blueprint (Infrastructure as Code)
#
# Resources created:
#   - PostgreSQL        : eminence-db
#   - Web service (API) : eminence-api-v2  (https://eminence-api-v2.onrender.com)
#   - Static site (UI)  : eminence-frontend-v2 (https://eminence-frontend-v2.onrender.com)
#
# Deploy: New +  →  Blueprint  →  "eminence-life-science" repo

databases:
  - name: eminence-db
    plan: free
    region: oregon
    databaseName: eminence_db
    user: eminence

services:
  # ── API (Express + Postgres) ────────────────────────────────
  - type: web
    name: eminence-api
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm run db:setup && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eminence-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://eminence-frontend-v2.onrender.com

  # ── Frontend (React static build) ─────────────────────────────
  - type: web
    name: eminence-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      # Proxy API calls to the backend service (order matters — must come first)
      - type: rewrite
        source: /api/*
        destination: https://eminence-api-v2.onrender.com/api/*
      # SPA fallback — serve index.html for all client-side routes so deep links
      # (/shop, /product/:slug, …) return 200 instead of 404. Render skips rules
      # when a real file exists at the path, so static assets are unaffected.
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Custom domain (optional — uncomment and add your domain) ──
  # domains:
  #   - eminencelife.science
